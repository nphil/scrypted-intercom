<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scrypted Intercom">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1d2733"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="iris" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4ae3a1"/>
      <stop offset="1" stop-color="#1b9df0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- talk out: warm-green arcs to the right -->
  <g fill="none" stroke="#4ae3a1" stroke-linecap="round" stroke-width="22">
    <path d="M336 200 A 80 80 0 0 1 336 312" opacity="1"/>
    <path d="M386 168 A 132 132 0 0 1 386 344" opacity="0.6"/>
    <path d="M436 136 A 184 184 0 0 1 436 376" opacity="0.28"/>
  </g>

  <!-- listen in: blue arcs to the left, same rhythm mirrored -->
  <g fill="none" stroke="#1b9df0" stroke-linecap="round" stroke-width="22">
    <path d="M176 200 A 80 80 0 0 0 176 312" opacity="1"/>
    <path d="M126 168 A 132 132 0 0 0 126 344" opacity="0.6"/>
    <path d="M76 136 A 184 184 0 0 0 76 376" opacity="0.28"/>
  </g>

  <!-- lens -->
  <circle cx="256" cy="256" r="74" fill="#080b0f"/>
  <circle cx="256" cy="256" r="74" fill="none" stroke="url(#iris)" stroke-width="16"/>
  <circle cx="256" cy="256" r="34" fill="url(#iris)"/>
  <circle cx="240" cy="240" r="11" fill="#f2fbff" opacity="0.9"/>
</svg>
